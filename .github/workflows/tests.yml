name: Tests

on:
  push:
  pull_request:

jobs:
  robot-programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run robot program tests (Python against a stand-in VEX library; C++ compile check)
        run: python -m unittest discover -s tests -v
